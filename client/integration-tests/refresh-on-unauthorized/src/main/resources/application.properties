quarkus.openapi-generator.codegen.spec.protected_refresh_yaml.base-package=org.acme.refresh
quarkus.openapi-generator.codegen.spec.protected_no_refresh_yaml.base-package=org.acme.norefresh

quarkus.rest-client.protected_refresh_yaml.url=${refresh.mock.url}
quarkus.rest-client.protected_no_refresh_yaml.url=${no-refresh.mock.url}

# Only the "refresh" scheme opts in to forcing a token refresh after a 401.
# The "no-refresh" scheme is left at its default (false) as a control.
quarkus.openapi-generator.protected_refresh_yaml.auth.refresh_oauth2.refresh-on-unauthorized=true

# Oidc client used by the refresh_oauth2 securityScheme
quarkus.oidc-client.refresh_oauth2.auth-server-url=${refresh.mock.url}
quarkus.oidc-client.refresh_oauth2.token-path=/token
quarkus.oidc-client.refresh_oauth2.discovery-enabled=false
quarkus.oidc-client.refresh_oauth2.client-id=test-app
quarkus.oidc-client.refresh_oauth2.grant.type=client
quarkus.oidc-client.refresh_oauth2.credentials.client-secret.method=basic
quarkus.oidc-client.refresh_oauth2.credentials.client-secret.value=secret

# Oidc client used by the no_refresh_oauth2 securityScheme
quarkus.oidc-client.no_refresh_oauth2.auth-server-url=${no-refresh.mock.url}
quarkus.oidc-client.no_refresh_oauth2.token-path=/token
quarkus.oidc-client.no_refresh_oauth2.discovery-enabled=false
quarkus.oidc-client.no_refresh_oauth2.client-id=test-app
quarkus.oidc-client.no_refresh_oauth2.grant.type=client
quarkus.oidc-client.no_refresh_oauth2.credentials.client-secret.method=basic
quarkus.oidc-client.no_refresh_oauth2.credentials.client-secret.value=secret

quarkus.keycloak.devservices.enabled=false
