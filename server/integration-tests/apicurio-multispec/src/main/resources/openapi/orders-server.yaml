openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
components:
  schemas:
    PurchaseOrder:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
