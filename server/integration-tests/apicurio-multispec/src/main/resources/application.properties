quarkus.openapi.generator.server.use=apicurio
quarkus.openapi.generator.server.spec.petstore_openapi_json.base-package=org.acme.petstore
# simple-server.yaml is NOT configured explicitly here
# It should be auto-discovered and generated with default package 'org.acme'
# orders-server.yaml keeps jakarta.ws.rs.core.Response as the return type of array responses
quarkus.openapi.generator.server.spec.orders_server_yaml.base-package=org.acme.orders
quarkus.openapi.generator.server.spec.orders_server_yaml.array-as-response=true
